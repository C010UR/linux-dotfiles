# JetBrains PhpStorm 2026.1 palette
#
# Sources, all read from your own install/config rather than guessed:
#   UI theme     "Islands Dark"  -> ~/Apps/phpstorm/lib/intellij.platform.ide.impl.jar
#                                   themes/islands/ManyIslandsDark.theme.json
#   Editor       "Dark"          -> themes/expUI/expUI_darkScheme.xml
#                  (your scheme is "_@user_Dark", a partial copy of Dark, so the
#                   Dark values apply; its own overrides are editor-only)
#   Terminal     ANSI palette    -> DefaultColorSchemesManager.xml, scheme "Darcula",
#                                   BLOCK_TERMINAL_* keys (Reworked terminal engine,
#                                   the default in 2026.1; the older CONSOLE_* values
#                                   belong to the legacy engine and look mismatched)
#
# Editor scheme colours
background #1e1f22
foreground #bcbec4
cursor #ced0d6
cursor_text_color #1e1f22
selection_background #25324d
selection_foreground #bcbec4
url_color #548af7

# Terminal ANSI palette -- Reworked terminal engine (the 2026.1 default).
# These are the BLOCK_TERMINAL_* values from scheme "Darcula" in
# DefaultColorSchemesManager.xml. They are deliberately tuned to harmonise with
# the editor syntax colours (green ~ string, blue ~ function, cyan ~ number),
# unlike the older CONSOLE_* palette the legacy terminal engine used, which is
# duller and reads as a different theme next to the editor.
color0 #000000
color1 #f27481
color2 #6bcc62
color3 #e0ce70
color4 #5594fa
color5 #c092fa
color6 #47ccbd
color7 #ced0d6
color8 #4e5157
color9 #ff6b7a
color10 #67ff59
color11 #ffec1a
color12 #3399ff
color13 #d970ff
color14 #40ffe9
color15 #ffffff

# Split borders / bell, from the Islands Dark accent set
active_border_color #2e4d89
inactive_border_color #26282c
bell_border_color #e5bf00
