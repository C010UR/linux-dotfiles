# ~/.config/kitty/kitty.conf
#
# Colours and font taken from your PhpStorm 2026.1 install (Islands Dark UI,
# Dark editor scheme), with a tab bar divided by plain vertical bars instead of
# powerline shapes.
#
# kitty does not allow comments after a value on the same line -- every
# comment must be on its own line, as below.
#
# Reload a running instance with:  ctrl+shift+f5

#: Theme ------------------------------------------------------------------
# Extracted from the IDE itself: UI theme "Islands Dark" plus the editor scheme
# and terminal ANSI palette. See the header of that file for exact sources.
include phpstorm_islands_dark.conf

#: Font -------------------------------------------------------------------

# PhpStorm's default editor/terminal font is JetBrains Mono; this is the Nerd
# Font build of it, so the glyphs are identical plus icons.
font_family JetBrainsMono Nerd Font

# PhpStorm's default editor/terminal size is 13; 12 reads closer to it here.
font_size 12

# "auto" makes kitty use this family's own Bold/Italic faces. Do not spell out
# "JetBrainsMono Nerd Font Bold" here: fontconfig would look for that as a
# single family name, miss, and silently fall back to Noto Sans Mono.
bold_font auto
italic_font auto
bold_italic_font auto

# Keep glyph columns aligned for prompts/TUI boxes.
disable_ligatures never

#: Tab bar ----------------------------------------------------------------

# Flat tabs, divided by a thin vertical bar.
tab_bar_style separator
tab_separator " │"

tab_bar_edge top
tab_bar_align left
tab_bar_min_tabs 2
tab_bar_margin_width 0.0
tab_bar_show_new_tab_button no

# Islands Dark tab colours, straight from the theme:
#   tab bar          container-editor-bg  = gray-10  #191a1c
#   active tab       tab-selected-bg-active = blue-40 #233558
#   active label     text-default         = gray-130 #d1d3d9
#   inactive label   text-secondary       = gray-80  #73767c
# Set active_tab_background to #191a1c instead if you want no filled block at
# all, just brighter bold text.
tab_bar_background #191a1c
tab_bar_margin_color #191a1c

active_tab_background #233558
active_tab_foreground #d1d3d9

inactive_tab_background #191a1c
inactive_tab_foreground #73767c

# Bold label on the active tab instead of a colored block.
active_tab_font_style bold
inactive_tab_font_style normal

#: Tab titles ------------------------------------------------------------

tab_title_template "{index}: {title}"
active_tab_title_template "{index}: {title}"
tab_activity_symbol "● "

# last | left | previous | right -- tab to activate when the current one closes
tab_switch_strategy previous

#: Keys ------------------------------------------------------------------
# Already bound by default:
#   new tab        ctrl+shift+t
#   close tab      ctrl+shift+q
#   next tab       ctrl+shift+right   (also ctrl+tab)
#   previous tab   ctrl+shift+left    (also ctrl+shift+tab)
#   move tab       ctrl+shift+.  /  ctrl+shift+,
#   rename tab     ctrl+shift+alt+t
#   splits         ctrl+shift+enter, ctrl+shift+[ / ]

# Direct tab switching: ctrl+alt+1 .. ctrl+alt+9
# (ctrl+shift+1..9 is already taken by kitty's "move window to monitor N",
#  and kitty cannot unbind a single default shortcut without clearing them
#  all, so we use ctrl+alt instead.)
map ctrl+alt+1 goto_tab 1
map ctrl+alt+2 goto_tab 2
map ctrl+alt+3 goto_tab 3
map ctrl+alt+4 goto_tab 4
map ctrl+alt+5 goto_tab 5
map ctrl+alt+6 goto_tab 6
map ctrl+alt+7 goto_tab 7
map ctrl+alt+8 goto_tab 8
map ctrl+alt+9 goto_tab 9

# ctrl+alt+0 goes to the previously active tab
map ctrl+alt+0 goto_tab -1
