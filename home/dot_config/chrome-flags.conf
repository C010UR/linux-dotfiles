# --- Wayland platform (explicit native Wayland required for touchpad gestures) ---
--ozone-platform=wayland
--enable-features=UseOzonePlatform,TouchpadOverscrollHistoryNavigation,VaapiVideoDecoder,AcceleratedVideoEncoder

# --- Middle-click autoscroll (Linux-only blink feature) ---
--enable-blink-features=MiddleClickAutoscroll
--test-type

# --- Hyprland input / IME integration ---
--enable-wayland-ime
--wayland-text-input-version=3

# --- Better Wayland GTK integration ---
--gtk-version=4
