# Extra kernel parameters, appended by limine-entry-tool to whatever the
# installer configured. Only machine-independent flags belong here.
#
# NEVER put root=, rootflags= or resume= here — those are per-machine and are
# written by the installer. Copying them from another machine prevents boot.
KERNEL_CMDLINE[default]+="nowatchdog zswap.enabled=1 zswap.compressor=zstd zswap.max_pool_percent=25"
